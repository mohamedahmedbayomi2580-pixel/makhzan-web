<script type="text/plain" id="mainjs">
const $=s=>document.querySelector(s),L=window.__S;
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>fmt(new Date()),nextDay=s=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+1);return fmt(d)};
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
let db=JSON.parse(L.getItem('db')||'null')||{u:'admin',p:'123456789',t:'dark',shop:{n:'مخزن اولاد شلبه',ph:'',vat:0,low:10},prods:[],cust:[],sup:[],inv:[],pay:[],ret:[],hold:[],seq:1,lastBk:today(),sh:0};
// إصلاح قواعد البيانات القديمة أو الناقصة مع الحفاظ على كل البيانات الموجودة
 db.shop=Object.assign({n:'مخزن اولاد شلبه',ph:'',vat:0,low:10},db.shop||{});
 ['prods','cust','sup','inv','pay','ret','hold'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});
 if(!Number.isFinite(+db.seq)||+db.seq<1)db.seq=1;
const save=()=>{db.prods.forEach(p=>{p.qty=Math.round(p.qty*1e6)/1e6;if(p.res)p.res=Math.round(p.res*1e6)/1e6});const s=JSON.stringify(db);try{L.setItem('db',s)}catch(e){Object.keys(L).filter(k=>k.startsWith('bk_')||k=='db_prev').forEach(k=>L.removeItem(k));L.setItem('db',s)}};
const val=id=>$('#'+id).value;
let V='cash',cart=[],cf,ps='',rg=1,rd=today(),hq='',sb='c',rv=null,ok=0;
const newCf=()=>cf={c:'',t:'cash',dt:'p',dv:0,fee:0,site:'',pd:0};newCf();
const cust=id=>db.cust.find(c=>c.id==id),prod=id=>db.prods.find(p=>p.id==id);
const card=(t,b)=>`<section class="cd"><h3>${t}</h3>${b}</section>`;

/* ===== دخول ===== */
function go(v){V=v;render()}
function render(){document.documentElement.dataset.t=db.t;
$('#c').innerHTML={cash:vCash,inv:vInv,acc:vAcc,rep:vRep,res:vRes,set:vSet}[V]();
if(V=='cash'){uo();upd()}
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==V))}
function modal(h){$('#md').innerHTML=`<div class="mb"><div class="cd" id="rc">${h}<button class="b g np" onclick="cl()">إغلاق</button></div></div>`}
const cl=()=>$('#md').innerHTML='';
function share(t){if(navigator.share)navigator.share({text:t}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(t);alert('تم نسخ النص')}}
function txt(t,body){window._t=t+'\n'+body;modal(`<h3>${t}</h3><pre>${E(body)}</pre><div class="g2 np" style="margin-top:10px"><button class="b" onclick="print()">🖨️ طباعة / PDF</button><button class="b n" onclick="share(_t)">مشاركة</button></div>`)}

/* ===== الكاشير ===== */
function vCash(){
const op=db.prods.map(p=>`<option value="${p.id}">${E(p.n)} — متاح ${qtxt(p,p.qty-(p.res||0))}</option>`).join('');
const r=cart.map((x,i)=>`<div class="row"><span>${E(x.n)} × ${x.q} ${E(x.u)}</span><b>${m(x.q*x.pr)}</b><button class="b s r" onclick="cart.splice(${i},1);render()">✕</button></div>`).join('')||'<p class="mu">لا توجد أصناف. أضف صنفاً للبدء.</p>';
const cu=db.cust.map(c=>`<option value="${c.id}" ${cf.c==c.id?'selected':''}>${E(c.n)}</option>`).join('');
return card('🛒 إضافة صنف',`<select id="ps" onchange="uo()">${op}</select><div class="g2"><select id="us"></select><input id="q" type="number" step="any" value="1"></div><input id="up" type="number" min="0" step="any" placeholder="سعر الوحدة (يكتبه الكاشير)"><button class="b" onclick="addC()">إضافة للفاتورة</button>`)
+card('🧾 الفاتورة الحالية',r+'<div id="tt"></div>')
+card('📝 تفاصيل الفاتورة',`<div class="g2"><select onchange="cf.t=this.value;upd()"><option value="cash">نقدي</option><option value="credit" ${cf.t=='credit'?'selected':''}>آجل</option></select>
<button class="b g" style="margin:0" onclick="newCust('')">➕ عميل جديد</button></div>${custPick()}
<input type="number" min="0" placeholder="الخصم (مبلغ ثابت)" value="${cf.dv||''}" onchange="cf.dv=+this.value;cf.dt='f';upd()">
<div class="g2"><input type="number" placeholder="أجرة النقل والعتالة" value="${cf.fee||''}" onchange="cf.fee=+this.value;upd()"><input type="number" placeholder="المدفوع (للآجل)" value="${cf.pd||''}" onchange="cf.pd=+this.value"></div>
<input placeholder="موقع البناء" value="${E(cf.site)}" onchange="cf.site=this.value"><div class="mu">تاريخ السداد المخطط (للآجل)</div><input type="date" value="${cf.due||''}" onchange="cf.due=this.value">
<input type="tel" placeholder="رقم هاتف العميل (اختياري)" value="${E(cf.ph||'')}" onchange="cf.ph=this.value"><select onchange="cf.m=this.value"><option value="cash">الدفع: كاش</option><option value="visa" ${cf.m=='visa'?'selected':''}>فيزا</option><option value="net" ${cf.m=='net'?'selected':''}>الشبكة الإلكترونية</option><option value="wallet" ${cf.m=='wallet'?'selected':''}>محفظة رقمية</option></select><button class="b n" onclick="fin()" style="padding:15px;font-size:16px">✅ إنشاء فاتورة / تأكيد البيع</button>
<div class="g2"><button class="b a" onclick="hold()">⏸ تعليق الفاتورة</button><button class="b g" onclick="showHold()">المعلّقة (${db.hold.length})</button></div>`)}
function uo(){const p=prod(val('ps')||0),s=$('#us');if(s)s.innerHTML=p?p.units.map((u,i)=>`<option value="${i}">${E(u.n)} — ${m(p.price*u.f)}</option>`).join(''):''}
function calc(){const s=sum(cart,x=>x.q*x.pr),d=cf.dt=='p'?s*cf.dv/100:+cf.dv||0,v=(s-d)*(db.shop.vat||0)/100;return{s,d,v,t:s-d+v+(+cf.fee||0)}}
function upd(){const k=calc(),e=$('#tt');if(e)e.innerHTML=`<div class="row"><span>المجموع</span><b>${m(k.s)}</b></div><div class="row"><span>الخصم</span><b>${m(k.d)}</b></div><div class="row"><span>الضريبة</span><b>${m(k.v)}</b></div><div class="row"><span>النقل</span><b>${m(cf.fee)}</b></div><div class="row"><b>الإجمالي</b><b style="font-size:18px">${m(k.t)}</b></div>`}
function addC(){const p=prod(val('ps'));if(!p)return alert('أضف منتجات من المخزن أولاً');const u=p.units[val('us')],q=+val('q');if(!(q>0))return alert('أدخل كمية صحيحة');
const inCart=sum(cart.filter(x=>x.pid==p.id),x=>x.q*x.f);if((inCart+q*u.f)>p.qty-(p.res||0))return alert('الكمية المتاحة غير كافية');
cart.push({pid:p.id,n:p.n,u:u.n,f:u.f,q,pr:p.price*u.f});render()}
function fin(){if(!cart.length)return alert('الفاتورة فارغة');if(cf.t=='credit'&&!cf.c)return alert('اختر العميل للفاتورة الآجلة');
const k=calc();cart.forEach(x=>prod(x.pid).qty-=x.q*x.f);
const i={id:db.seq++,ts:Date.now(),day:today(),c:cf.c,t:cf.t,items:cart.map(x=>({...x,r:0})),s:k.s,d:k.d,v:k.v,fee:+cf.fee||0,tot:k.t,paid:cf.t=='cash'?k.t:(+cf.pd||0),site:cf.site};
if(cf.t=='credit')cust(cf.c).bal+=i.tot-i.paid;
db.inv.push(i);cart=[];newCf();save();showInv(i.id)}

else{if(un>0&&c)c.cr=(c.cr||0)+un;r.q=r.drawn;r.closed=1;db.log.push({ts:Date.now(),k:'فك حجز تلقائي',t:`${cn(r.c)} — ${pn(r.pid)} × ${l}`+(un>0?` — العربون ${m(un)} صار رصيداً دائناً`:'')})}n++}});

else if(r[0]=='k')two(r[1],r[2],r[3]||18,r[4]);else tx(r[1],r[2]||18,'right',r[3])});

/* --- فك شفرة Code39 من الصورة (بدون مكتبات) --- */
function dec(row){const R=[];let c=row[0],n=0;for(const v of row){if(v==c)n++;else{R.push([c,n]);c=v;n=1}}R.push([c,n]);
const rev={};for(const k in C39)rev[C39[k]]=k;
const ch=i=>{if(i+9>R.length||R[i][0]!==1)return null;const L=R.slice(i,i+9).map(z=>z[1]),s=[...L].sort((a,b)=>b-a);if(s[2]<s[3]*1.5)return null;return rev[L.map(z=>z>=s[2]?'w':'n').join('')]};
for(let i=0;i<R.length;i++){if(ch(i)!='*')continue;let o='',j=i+10;while(j<R.length){const k=ch(j);if(k==null)break;if(k=='*')return o;o+=k;j+=10}}return null}
let _cam=null;

function scanGo(v){const id=parseInt(String(v).replace(/[^0-9]/g,''),10);if(!id)return alert('رقم غير صالح');stopCam();
if(navigator.vibrate)navigator.vibrate(80);
if(db.inv.find(x=>x.id==id))return showInv(id);
if((db.rinv||[]).find(x=>x.id==id))return rtnView(id);

alert('لا توجد فاتورة بهذا الرقم: '+id)}
async function scanUI(){modal(`<h3>📷 قراءة باركود فاتورة</h3><video id="sv" playsinline muted style="width:100%;border-radius:10px;background:#000"></video><div class="mu">وجّه الكاميرا على الباركود، أو اكتب الرقم / امسحه بقارئ خارجي</div><input id="sm" type="tel" placeholder="رقم الفاتورة" onkeydown="if(event.key=='Enter')scanGo(this.value)"><button class="b n" onclick="scanGo(val('sm'))">فتح الفاتورة</button>`);
const v=$('#sv');try{_cam=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}}});v.srcObject=_cam;await v.play()}catch(e){stopCam();toast('تعذر فتح الكاميرا — اكتب الرقم يدوياً','#d97706');return}
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true}),BD=window.BarcodeDetector?new BarcodeDetector({formats:['code_39']}):null;let busy=0;
const t=setInterval(async()=>{if(!$('#sv')||!_cam){clearInterval(t);stopCam();return}if(busy||!v.videoWidth)return;busy=1;
cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);let code=null;

if(!code){const W=cv.width,H=cv.height;for(let q=.35;q<=.65&&!code;q+=.03){const d=cx.getImageData(0,Math.floor(H*q),W,1).data,g=[];for(let i=0;i<W;i++)g.push((d[i*4]+d[i*4+1]+d[i*4+2])/3);
const sm=g.map((a,i)=>(g[Math.max(0,i-1)]+a+g[Math.min(W-1,i+1)])/3);let lo=255,hi=0;sm.forEach(a=>{lo=Math.min(lo,a);hi=Math.max(hi,a)});if(hi-lo<50)continue;
const th=(lo+hi)/2,b=sm.map(a=>a<th?1:0);code=dec(b)||dec(b.slice().reverse())}}
busy=0;if(code){clearInterval(t);scanGo(code)}},250)}

/* ===== v9: بدون دخول + التقارير مفتوحة + جبس وسن + وحدات التحويل (طن/شكارة) ===== */
function m3(n){return (+n||0).toLocaleString('en-US',{maximumFractionDigits:3})}
function unitsOf(k,ch){const t=MT.find(a=>a[0]==k);if(!t)return[{n:ch||'وحدة',f:1}];return[{n:t[4]||ch||t[3][0],f:1}].concat((t[5]||[]).map(([n,c])=>({n,f:1/c})))}
function qtxt(p,q){q=+q||0;const u=(p.units&&p.units.length)?p.units:[{n:'',f:1}];return m3(q)+' '+u[0].n+u.slice(1).map(x=>' = '+m3(q/x.f)+' '+x.n).join('')}
function lowQ(p){const u=p.units&&p.units[p.units.length-1];return p.qty/((u&&u.f)||1)<=db.shop.low}
function eqs(k,v){const u=unitsOf(k,window._mu),q=+v;if(!(q>0)||u.length<2)return '';return 'يعادل '+u.slice(1).map(x=>m3(q/x.f)+' '+x.n).join(' و ')}

/* تحويل البيانات القديمة تلقائياً مرة واحدة إلى وحدات التسجيل الجديدة */
function migrate(){let ch=0;db.prods.forEach(p=>{if(!p.k||p.mv>=2)return;const t=MT.find(a=>a[0]==p.k);if(!t){p.mv=2;return}
const old=p.units&&p.units[0]?p.units[0].n:null,base=t[4];let g=1;
if(base){if(old==base)g=1;else{const al=(t[5]||[]).find(a=>a[0]==old);if(al)g=1/al[1];else if(p.k=='brick'&&old=='عدد')g=1/1000;else g=null}}
if(g==null){p.mv=2;ch=1;return}
if(g!=1){p.qty*=g;p.res=(p.res||0)*g;if(p.cost!=null)p.cost/=g;if(p.price)p.price/=g;(p.buys||[]).forEach(b=>{b.q*=g;b.c/=g});
db.inv.concat(db.canc||[]).forEach(i=>i.items.forEach(x=>{if(x.pid==p.id)x.f*=g}));
(db.hold||[]).forEach(h=>h.cart.forEach(x=>{if(x.pid==p.id)x.f*=g}));(db.cart||[]).forEach(x=>{if(x.pid==p.id&&!(db.hold||[]).some(h=>h.cart.includes(x)))x.f*=g});
db.rsv.forEach(r=>{if(r.pid==p.id){r.q*=g;r.drawn*=g;r.price/=g}})}
if(base)p.units=unitsOf(p.k,base);p.mv=2;ch=1});if(ch)save()}

function rsvUn(){const p=prod(val('rsp')),s=$('#rsun');if(s)s.innerHTML=p?p.units.map((u,i)=>`<option value="${i}">${E(u.n)}</option>`).join(''):''}
function rsvForm(cid){modal(`<h3>📌 حجز بضاعة — ${E(cn(cid))}</h3><select id="rsp" onchange="rsvUn()">${db.prods.map(p=>`<option value="${p.id}">${E(p.n)} — متاح ${qtxt(p,p.qty-(p.res||0))}</option>`).join('')}</select><div class="g2"><select id="rsun"></select><input id="rsq" type="number" min="0" step="any" placeholder="الكمية"></div><input id="rsu" type="number" min="0" step="any" placeholder="سعر الوحدة المتفق عليه (للوحدة المختارة)"><div class="mu">تاريخ انتهاء الحجز (إلزامي)</div><input id="rse" type="date"><input id="rsd" type="number" min="0" step="any" placeholder="العربون المدفوع الآن"><select id="rsm"><option value="cash">كاش</option><option value="visa">فيزا</option><option value="net">الشبكة</option><option value="wallet">محفظة</option></select><input id="rsph" type="tel" placeholder="رقم هاتف العميل (اختياري)" value="${E(cust(cid).ph||'')}"><button class="b n" onclick="doRsv(${cid})">تأكيد الحجز</button>`);rsvUn()}
function doRsv(cid){const p=prod(val('rsp')),un=p&&(p.units[val('rsun')]||p.units[0]),q0=+val('rsq'),e=val('rse'),d=+val('rsd')||0,u0=val('rsu'),ph=val('rsph').trim();
if(!p||!(q0>0)||u0===''||+u0<0)return alert('أكمل البيانات (الكمية وسعر الوحدة)');if(ph&&!/^[0-9+\s-]{7,}$/.test(ph))return alert('رقم الهاتف غير صحيح — اكتبه صحيحاً أو اتركه فارغاً');if(!e||e<=today())return alert('تاريخ انتهاء الحجز إلزامي ويكون بعد اليوم');
const q=q0*un.f,pr=+u0/un.f;if(d<0||d>q*pr+1e-6)return alert('العربون لا يزيد عن قيمة الحجز ولا يقل عن صفر');
const r={id:db.seq++,no:db.rsq=(db.rsq||0)+1,ph,c:cid,pid:p.id,q,drawn:0,exp:e,price:pr,dep:d,used:0,m:val('rsm'),ts:Date.now(),day:today()};p.res=(p.res||0)+q;if(!cust(cid).ph)cust(cid).ph=ph;db.rsv.push(r);
if(d>0)db.cf.push({id:db.seq++,ts:r.ts,day:r.day,k:'dep',m:r.m,amt:d,ref:r.id});save();sched();cl();toast('تم الحجز كعربون — لا يُحسب مبيعات إلا عند التسليم');rsvView(r.id)}


/* ===== v10: مخزن ثابت (حديد بالطن/الكيلو) + بحث وإنشاء عميل بالكاشير + مقاسات الطباعة + تخزين بلا حد ===== */
function thermal(){return db.tpl.paper=='58'?'58':'80'}
function unitsOf(k,ch,kg){const t=MT.find(a=>a[0]==k);if(!t)return[{n:ch||'وحدة',f:1}];return[{n:t[4]||ch||t[3][0],f:1}].concat((t[5]||[]).map(([n,c])=>({n,f:1/((k=='steel'&&+kg>0)?+kg:c)})))}
function eqs(k,v){const kg=$('#kgt')?+val('kgt'):0,u=unitsOf(k,window._mu,kg),q=+v;if(!(q>0)||u.length<2)return '';return 'يعادل '+u.slice(1).map(x=>m3(q/x.f)+' '+x.n).join(' و ')}
function isLeg(p,t){return !!(p&&t[4]&&p.units&&p.units[0]&&p.units[0].n!=t[4])}

/* تحويل البيانات القديمة (مرة واحدة) + توحيد أسماء الأقسام */
function migrate(){let ch=0;db.prods.forEach(p=>{if(!p.k)return;const t=MT.find(a=>a[0]==p.k);if(!t)return;
if(p.cat!=t[1]){p.cat=t[1];p.n=t[1]+(p.tn?' '+p.tn:'');ch=1}
if(p.mv>=3)return;
const old=p.units&&p.units[0]?p.units[0].n:null,base=t[4];let g=1;
if(base){if(old==base)g=1;else{const al=(t[5]||[]).find(a=>a[0]==old);if(al&&p.k!='steel')g=1/al[1];else if(p.k=='brick'&&old=='عدد')g=1/1000;else g=null}}
if(g==null){p.mv=3;ch=1;return}
if(g!=1){p.qty*=g;p.res=(p.res||0)*g;if(p.cost!=null)p.cost/=g;if(p.price)p.price/=g;(p.buys||[]).forEach(b=>{b.q*=g;b.c/=g});
db.inv.concat(db.canc||[]).forEach(i=>i.items.forEach(x=>{if(x.pid==p.id)x.f*=g}));
(db.hold||[]).forEach(h=>h.cart.forEach(x=>{if(x.pid==p.id)x.f*=g}));(db.cart||[]).forEach(x=>{if(x.pid==p.id&&!(db.hold||[]).some(h=>h.cart.includes(x)))x.f*=g});
db.rsv.forEach(r=>{if(r.pid==p.id){r.q*=g;r.drawn*=g;r.price/=g}})}
if(p.k=='steel'&&base&&!p.kg)p.kg=1000;
if(base)p.units=unitsOf(p.k,base,p.kg);p.mv=3;ch=1});if(ch)save()}

function typeForm(k,id){const t=MT.find(a=>a[0]==k),p=id?prod(id):null,lg=isLeg(p,t);window._mu=p?p.units[0].n:t[3][0];const bu=unitsOf(k,_mu,p&&p.kg,p&&p.bars&&p.barKg?{n:p.bars,k:p.barKg}:null),alt=(k=='steel'&&!(p&&p.kg)?[]:bu.slice(1)).map(x=>`1 ${bu[0].n} = ${m3(1/x.f)} ${x.n}`).join(' | ');
modal(`<h3>${t[2]} ${t[1]} — ${p?'تعديل نوع':'نوع جديد'}</h3><input id="tyn" placeholder="اسم النوع (مثال: أسيوط، السويس)" value="${E(p&&p.tn||'')}">`
+`<div class="mu">وحدة التسجيل: <b>${E(t[3][0])}</b>${alt?' — '+alt:''}</div>`
+(k=='steel'&&!lg?`<div class="mu">الطن يساوي كم سيخ؟</div><input id="stn" type="number" min="1" step="any" value="${p&&p.bars||''}" placeholder="مثال: 94" oninput="$('#eqh').textContent=eqs('steel',val('mtq'));$('#sth').textContent=stHint()"><div class="mu">السيخ الواحد كام كيلو؟</div><input id="stk" type="number" min="0.001" step="any" value="${p&&p.barKg||''}" placeholder="مثال: 10.65" oninput="$('#eqh').textContent=eqs('steel',val('mtq'));$('#sth').textContent=stHint()"><div id="sth" class="mu" style="color:var(--ac);font-weight:700">${p&&p.bars&&p.barKg?'الطن = '+m3(p.bars)+' سيخ = '+m3(p.bars*p.barKg)+' كيلو':''}</div>`:'')
+(lg?`<div class="ro">هذا النوع مسجّل بوحدة قديمة (${E(p.units[0].n)}) — يبقى كما هو بدون تحويل.</div>`:'')
+`<div class="mu">سعر الشراء (التكلفة) لكل ${E(lg?p.units[0].n:(t[4]||'وحدة'))} — سري ولا يظهر في الفاتورة</div><input id="mtc" type="number" min="0" step="any" value="${p&&p.cost!=null?p.cost:''}"><div class="mu">الكمية الفعلية بالمخزن${t[4]&&!lg?' ('+E(t[4])+')':''}</div><input id="mtq" type="number" step="any" value="${p?p.qty:''}" oninput="$('#eqh').textContent=eqs('${k}',this.value)"><div id="eqh" class="mu" style="color:var(--ac);font-weight:700">${p&&!lg?eqp(p):''}</div>
<button class="b n" onclick="saveType('${k}',${id||0})">حفظ</button>`
+(p?`<h3 style="margin-top:12px">➕ توريد كمية جديدة (يُحسب متوسط التكلفة تلقائياً)</h3><div class="g2"><input id="rsk" type="number" min="0" step="any" placeholder="الكمية${t[4]&&!lg?' بال'+E(t[4]):''}" oninput="$('#eqr').textContent=eqs('${k}',this.value)"><input id="rsc" type="number" min="0" step="any" placeholder="سعر الشراء${t[4]&&!lg?' لل'+E(t[4]):''}"></div><div id="eqr" class="mu" style="color:var(--ac);font-weight:700"></div><button class="b a" onclick="restock(${id},'${k}')">توريد</button><button class="b r" onclick="pin(()=>delType(${id},'${k}'))">🗑️ حذف المنتج نهائياً</button>`:'')
+`<button class="b g" onclick="catView('${k}')">↩ رجوع لأنواع ${t[1]}</button>`)}
function saveType(k,id){const c=val('mtc'),q=val('mtq'),tn=val('tyn').trim(),t=MT.find(a=>a[0]==k),L=db.prods.filter(p=>p.k==k),old=id?prod(id):null,lg=isLeg(old,t),st=(k=='steel'&&!lg)?stv():null;
if(c==='')return alert('سعر الشراء إلزامي');if(+c<0)return alert('لا يُسمح بقيم سالبة');if(k=='steel'&&!lg&&!st)return alert('اكتب: الطن يساوي كم سيخ، والسيخ الواحد كام كيلو');
if(!tn&&!id&&L.length)return alert('اكتب اسم النوع لتمييزه عن الأنواع الأخرى');if(tn&&L.some(p=>p.id!=id&&p.tn==tn))return alert('هذا النوع موجود بالفعل');
let p=old;if(!p){p={id:db.seq++,k,cat:t[1],bc:'',res:0,qty:0,units:[]};db.prods.push(p)}
p.tn=tn;p.n=t[1]+(tn?' '+tn:'');if(!lg){p.units=unitsOf(k,t[3][0],st?st.n*st.k:0,st);if(k=='steel'){p.kg=st.n*st.k;p.bars=st.n;p.barKg=st.k}}p.cost=+c;if(q!=='')p.qty=+q;p.mv=3;save();render();toast('تم الحفظ — '+qtxt(p,p.qty));catView(k)}

/* --- الكاشير: بحث عن العميل بالاسم + إنشاء عميل --- */
function custPick(){const c=cust(cf.c);
if(c)return `<div class="row" style="border:1px solid var(--bd);border-radius:14px;padding:8px 12px;margin-bottom:10px"><span>👤 <b>${E(c.n)}</b> <span class="mu">${E(c.ph||'')}</span>${c.bal>0?` <span class="tag">دين ${m(c.bal)}</span>`:''}</span><button class="b s r" onclick="cf.c='';render()">✕</button></div>`;
return `<input id="csq" placeholder="🔍 ابحث عن عميل بالاسم أو الهاتف (اختياري للنقدي)" oninput="csrch(this.value)" autocomplete="off"><div id="csr"></div>`}
function csrch(q){q=(q||'').trim();const e=$('#csr');if(!e)return;if(!q){e.innerHTML='';return}
const L=db.cust.filter(c=>(c.n+' '+(c.ph||'')).includes(q)).slice(0,6);
e.innerHTML=L.map(c=>`<div class="row" style="cursor:pointer" onclick="pickCust(${c.id})"><span>👤 ${E(c.n)} <span class="mu">${E(c.ph||'')}</span></span><b class="${c.bal>0?'low':''}">${c.bal>0?m(c.bal):''}</b></div>`).join('')
+`<div class="row" style="cursor:pointer;color:var(--ac);font-weight:700" data-q="${E(q)}" onclick="newCust(this.dataset.q)">➕ إنشاء عميل جديد «${E(q)}»</div>`}
function pickCust(id){cf.c=id;cf.ph=(cust(id)||{}).ph||cf.ph||'';render()}
function newCust(nm){modal(`<h3>➕ عميل جديد</h3><input id="ncn" placeholder="اسم العميل" value="${E(nm||'')}"><input id="ncp" type="tel" placeholder="رقم الهاتف (اختياري)" value="${E(cf.ph||'')}"><input id="nca" placeholder="العنوان (اختياري)"><button class="b n" onclick="saveNewCust()">حفظ واختيار العميل</button>`)}
function saveNewCust(){const n=val('ncn').trim(),ph=val('ncp').trim();if(!n)return alert('اكتب اسم العميل');if(ph&&!/^[0-9+\s-]{7,}$/.test(ph))return alert('رقم الهاتف غير صحيح');
if(db.cust.find(c=>c.n==n)&&!confirm('يوجد عميل بنفس الاسم «'+n+'». إنشاء عميل جديد بنفس الاسم؟'))return;
const c={id:db.seq++,n,ph,ad:val('nca').trim(),bal:0};db.cust.push(c);cf.c=c.id;cf.ph=ph||cf.ph||'';save();cl();render();toast('تمت إضافة العميل وسيظهر في الحسابات')}

/* --- الطباعة: مقاسات 58 / 80 / A5 / A4 --- */
function sampleInv(){return db.inv[db.inv.length-1]||{id:1,ts:Date.now(),c:'',t:'cash',items:[{n:'أسمنت',u:'شكارة',q:10,pr:95,r:0}],s:950,d:0,v:0,fee:0,tot:950,paid:950}}

/* --- الشعار: تصغير تلقائي --- */
function logo(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);db.tpl.logo=c.toDataURL('image/jpeg',.85);save();ldLogo(pvw)};im.onerror=()=>{db.tpl.logo=r.result;save();ldLogo(pvw)};im.src=r.result};r.readAsDataURL(f)}


/* ===== v11: الحديد — الطن = كم سيخ، والسيخ = كم كيلو (يحددها التاجر) ===== */
function unitsOf(k,ch,kg,st){const t=MT.find(a=>a[0]==k);if(!t)return[{n:ch||'وحدة',f:1}];const b=[{n:t[4]||ch||t[3][0],f:1}];
if(k=='steel'){if(st&&st.n>0&&st.k>0)return b.concat([{n:'سيخ',f:1/st.n},{n:'كيلو',f:1/(st.n*st.k)}]);if(+kg>0)return b.concat([{n:'كيلو',f:1/+kg}]);return b}
return b.concat((t[5]||[]).map(([n,c])=>({n,f:1/c})))}
function stv(){const n=+(($('#stn')||{}).value),k=+(($('#stk')||{}).value);return(n>0&&k>0)?{n,k}:null}
function stHint(){const s=stv();return s?'الطن = '+m3(s.n)+' سيخ = '+m3(s.n*s.k)+' كيلو':''}
function eqs(k,v){const st=k=='steel'?stv():null;if(k=='steel'&&!st)return '';const u=unitsOf(k,window._mu,0,st),q=+v;if(!(q>0)||u.length<2)return '';return 'يعادل '+u.slice(1).map(x=>m3(q/x.f)+' '+x.n).join(' و ')}
function eqp(p){if(!p.units||p.units.length<2)return '';return 'يعادل '+p.units.slice(1).map(x=>m3(p.qty/x.f)+' '+x.n).join(' و ')}
migrate();render();
try{var _bt=document.getElementById('boot');if(_bt)_bt.remove()}catch(e){}
</script>
<script>
(function(){
var S={},q={},timer=null,dbp=null,ls=false;
function def(n,f){Object.defineProperty(S,n,{value:f,enumerable:false})}
function step(t){try{var e=document.getElementById('bootst');if(e)e.textContent=t}catch(x){}}
function banner(t){try{var bt=document.getElementById('boot');if(bt)bt.remove();var d=document.getElementById('errbn');if(!d){d=document.createElement('div');d.id='errbn';d.style.cssText='position:fixed;left:8px;right:8px;bottom:96px;z-index:99999;background:#7f1d1d;color:#fff;padding:10px 12px;border-radius:12px;font:12px/1.5 monospace;direction:ltr;text-align:left;max-height:35vh;overflow:auto;white-space:pre-wrap';document.body.appendChild(d)}d.textContent+=t+'\n'}catch(e){}}
window.addEventListener('error',function(e){banner('JS error: '+e.message+' @'+(e.lineno||'?'))});
window.addEventListener('unhandledrejection',function(e){banner('Promise error: '+(e.reason&&e.reason.message||e.reason))});
function openDb(){return new Promise(function(res,rej){try{var r=indexedDB.open('shalaba-store',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};r.onblocked=function(){rej(new Error('blocked'))}}catch(e){rej(e)}})}
function readAll(d){return new Promise(function(res,rej){var o={},c=d.transaction('kv','readonly').objectStore('kv').openCursor();c.onsuccess=function(){var u=c.result;if(u){o[u.key]=u.value;u.continue()}else res(o)};c.onerror=function(){rej(c.error)}})}
function flush(){timer=null;var keys=Object.keys(q);if(!keys.length)return;var b=q;q={};
if(ls||!dbp){keys.forEach(function(k){try{if(b[k]===null)localStorage.removeItem(k);else localStorage.setItem(k,b[k])}catch(e){}});return}
try{var tx=dbp.transaction('kv','readwrite'),st=tx.objectStore('kv');keys.forEach(function(k){if(b[k]===null)st.delete(k);else st.put(b[k],k)});
tx.onerror=tx.onabort=function(){keys.forEach(function(k){if(!(k in q))q[k]=b[k]});banner('تعذر حفظ البيانات، جارٍ إعادة المحاولة');if(!timer)timer=setTimeout(flush,2000)}}catch(e){keys.forEach(function(k){if(!(k in q))q[k]=b[k]});banner('Storage: '+e.message)}}
function sched(){if(!timer)timer=setTimeout(flush,60)}
def('getItem',function(k){return Object.prototype.hasOwnProperty.call(S,k)?S[k]:null});
def('setItem',function(k,v){S[k]=String(v);q[k]=S[k];sched()});
def('removeItem',function(k){delete S[k];q[k]=null;sched()});
window.__S=S;
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flush()});
window.addEventListener('pagehide',flush);
var started=false;
function start(){if(started)return;started=true;step('2/2 تشغيل البرنامج…');setTimeout(function(){try{var s=document.createElement('script');s.textContent=document.getElementById('mainjs').textContent;document.body.appendChild(s)}catch(e){banner('Start: '+e.message)}},30)}
function loadLS(){ls=true;try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);S[k]=localStorage.getItem(k)}}catch(x){}}
var tmo=setTimeout(function(){if(!started){loadLS();banner('التخزين المتقدم لا يستجيب — تم التشغيل بالتخزين العادي');start()}},3500);
step('1/2 فتح التخزين…');
function fromLS(){var n=0;try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k==='db'||k==='db_prev'||k.indexOf('bk_')===0){S[k]=localStorage.getItem(k);q[k]=S[k];n++}}}catch(e){}return n}
openDb().then(function(d){dbp=d;return readAll(d)}).then(function(all){
 if(started)return;clearTimeout(tmo);for(var k in all)S[k]=all[k];
 if(!Object.prototype.hasOwnProperty.call(S,'db')){var copied=fromLS();if(copied){flush();}}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 start();
 /* حذف النسخة القديمة من localStorage بعد التأكد من الحفظ */
 setTimeout(function(){try{if(dbp){var r=dbp.transaction('kv','readonly').objectStore('kv').get('db');r.onsuccess=function(){if(r.result){var del=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k==='db'||k==='db_prev'||k.indexOf('bk_')===0)del.push(k)}del.forEach(function(k){localStorage.removeItem(k)})}}}}catch(e){}},3000);
}).catch(function(e){if(started)return;clearTimeout(tmo);loadLS();banner('IndexedDB غير متاح — تم استخدام التخزين العادي ('+(e&&e.message)+')');start()});
})();
</script></body></html>
