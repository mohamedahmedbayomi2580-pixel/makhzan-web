<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="theme-color" content="#050b18">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مخزن اولاد شلبه</title>
<style>
:root{color-scheme:dark;
--pg:#050912;--pt:#e8eefc;--cd:#0d1830;--c1:#14284f;--c2:#09132b;--bd:rgba(120,160,230,.14);--tx:#e6edfb;--mu:#8da2c8;--ac:#f5a623;--rd:#ef4444;--gn:#22a55b;
--h3:#f4f7ff;--in:#070e20;--sd:rgba(0,0,0,.62);--sl:rgba(70,115,200,.17);--ln:rgba(120,160,230,.11);--btn1:#1d3f7c;--btn2:#0b1d42;
--grad:linear-gradient(165deg,#01030a 0%,#050d1c 26%,#091a38 60%,#0c2a58 100%)}
[data-t=light]{color-scheme:light;
--pg:#dde5f0;--pt:#0b1f3a;--cd:#e6ecf5;--c1:#eef3fa;--c2:#dbe3ef;--bd:rgba(11,31,58,.10);--tx:#14233f;--mu:#5b6b86;
--h3:#0b1f3a;--in:#d9e1ee;--sd:rgba(125,145,182,.55);--sl:rgba(255,255,255,.95);--ln:rgba(11,31,58,.08);--btn1:#2358a8;--btn2:#123572;
--grad:linear-gradient(165deg,#eef2f8,#d5deeb)}
*{box-sizing:border-box}
html{background:var(--pg)}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--pt);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh;
background:linear-gradient(var(--ln) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(90deg,var(--ln) 1px,transparent 1px) 0 0/30px 30px,var(--grad);background-attachment:fixed}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:5px;z-index:30;background:repeating-linear-gradient(-45deg,#f5a623 0 10px,#0a0e18 10px 20px);box-shadow:0 2px 10px rgba(0,0,0,.5)}
#lg{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--grad);color:#fff;gap:14px}
#lg .fm{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#app{display:block;padding:16px 14px 120px;max-width:720px;margin:auto}
#app>.row:first-child{padding:12px 16px;margin-bottom:16px;border-radius:20px;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:8px 8px 18px var(--sd),-6px -6px 14px var(--sl);border-bottom:0;color:var(--tx)}
#hn{font-size:18px;font-weight:800;letter-spacing:.3px;color:var(--h3)}
#hn::before{content:"";display:inline-block;width:24px;height:14px;margin-left:10px;border-radius:3px;background:linear-gradient(145deg,#ffc04d,#c97a00);box-shadow:0 0 10px rgba(245,166,35,.55);vertical-align:-1px}
.cd{background:linear-gradient(145deg,var(--c1),var(--c2));color:var(--tx);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:16px;box-shadow:9px 9px 20px var(--sd),-7px -7px 16px var(--sl)}
.cd .cd{border-radius:16px;box-shadow:5px 5px 11px var(--sd),-4px -4px 9px var(--sl)}
.cd h3{margin:0 0 12px;font-size:16px;color:var(--h3);display:flex;align-items:center;gap:8px}
.cd h3::before{content:"";flex:none;width:5px;height:18px;border-radius:3px;background:linear-gradient(var(--ac),#c97a00);box-shadow:0 0 8px rgba(245,166,35,.45)}
input,select,textarea{width:100%;padding:12px 14px;margin:0 0 10px;background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:14px;font:inherit;box-shadow:inset 4px 4px 9px rgba(0,0,0,.5),inset -3px -3px 8px var(--sl)}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.8}
input:focus,select:focus,textarea:focus{outline:0;border-color:rgba(245,166,35,.6);box-shadow:inset 4px 4px 9px rgba(0,0,0,.5),inset -3px -3px 8px var(--sl),0 0 0 3px rgba(245,166,35,.18)}
input:disabled{opacity:.6}
option{background:var(--in);color:var(--tx)}
.b{background:linear-gradient(145deg,var(--btn1),var(--btn2));color:#fff;border:1px solid rgba(150,190,255,.14);border-radius:14px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer;width:100%;margin-bottom:8px;box-shadow:5px 5px 12px var(--sd),-3px -3px 9px var(--sl);transition:box-shadow .15s,transform .15s;-webkit-tap-highlight-color:transparent}
.b:active{box-shadow:inset 4px 4px 9px rgba(0,0,0,.55),inset -3px -3px 7px var(--sl);transform:translateY(1px)}
.b.s{width:auto;padding:7px 12px;margin:0;font-size:13px;border-radius:11px;box-shadow:3px 3px 8px var(--sd),-2px -2px 6px var(--sl)}
.b.r{background:linear-gradient(145deg,#e55050,#a41e2a)}
.b.a{background:linear-gradient(145deg,#ffc455,#e08e0b);color:#1a1200;border-color:rgba(255,220,150,.4)}
.b.g{background:linear-gradient(145deg,var(--c1),var(--c2));color:var(--tx)}
.b.n{background:linear-gradient(145deg,#31c576,#14803f)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln);font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mu{color:var(--mu);font-size:13px;margin:4px 0}.low{color:#ff6b6b;font-weight:700}
.tag{display:inline-block;padding:2px 9px;border-radius:9px;font-size:12px;background:rgba(239,68,68,.18);color:#ff9a9a;border:1px solid rgba(239,68,68,.35)}
.ro{background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.5);border-radius:16px;padding:12px;margin-bottom:12px;color:#ffd48a;font-weight:700}
table{color:var(--tx);border-collapse:collapse}th{color:var(--mu);font-weight:700;padding:4px}td{padding:5px 4px;border-top:1px solid var(--ln)}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));right:10px;left:10px;display:flex;gap:2px;background:linear-gradient(145deg,#13264d,#060c1d);border:1px solid rgba(120,160,230,.16);border-radius:26px;padding:7px 5px;z-index:5;box-shadow:0 10px 26px rgba(0,0,0,.65),-4px -4px 12px rgba(60,100,180,.12)}
nav button{flex:1;background:none;border:0;color:#7f95bd;font:inherit;font-size:11px;padding:6px 0;cursor:pointer;border-radius:18px;-webkit-tap-highlight-color:transparent;transition:.15s}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--ac);background:rgba(0,0,0,.32);box-shadow:inset 3px 3px 7px rgba(0,0,0,.65),inset -2px -2px 5px rgba(80,120,200,.15);text-shadow:0 0 10px rgba(245,166,35,.55)}
#md .mb{position:fixed;inset:0;background:rgba(2,5,12,.78);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);overflow:auto;padding:16px;z-index:9}
#md .cd{max-width:520px;margin:auto}
pre{white-space:pre-wrap;font:inherit;margin:0}
button.b[onclick^="catView"]{border-radius:22px;min-height:106px;line-height:1.75;border:1px solid rgba(255,255,255,.1)}
button.b[onclick="catView('cement')"]{background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 16px),linear-gradient(145deg,#46587a,#1a2440)!important}
button.b[onclick="catView('sand')"]{background:linear-gradient(145deg,#8a6a2c,#33250c)!important}
button.b[onclick="catView('gravel')"]{background:radial-gradient(circle at 20% 25%,rgba(255,255,255,.07) 0 4px,transparent 5px),radial-gradient(circle at 70% 65%,rgba(255,255,255,.06) 0 5px,transparent 6px),linear-gradient(145deg,#586275,#1f2736)!important}
button.b[onclick="catView('steel')"]{background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,transparent 2px 12px),linear-gradient(145deg,#2f65ad,#0c2550)!important}
button.b[onclick="catView('brick')"]{background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 18px),linear-gradient(145deg,#a8402f,#4a1710)!important}
button.b[onclick^="catView"][style*="#6b7280"]{filter:saturate(.4) brightness(.78)}
#tpv{background:var(--in)!important;border-radius:14px!important}
#pv canvas,#tpv canvas{border:0!important;border-radius:12px;box-shadow:4px 4px 12px var(--sd),-3px -3px 8px var(--sl);background:#fff}
div[style*="z-index:99"]{border-radius:16px!important;box-shadow:0 8px 22px rgba(0,0,0,.5)}
#ft{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px auto 0;padding:9px 18px;width:max-content;max-width:100%;border-radius:20px;background:linear-gradient(145deg,var(--c1),var(--c2));color:var(--mu);font-size:13px;font-weight:700;box-shadow:5px 5px 12px var(--sd),-3px -3px 9px var(--sl)}
#ft a{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,#2fd06f,#128c4a);box-shadow:3px 3px 8px var(--sd),-2px -2px 6px var(--sl);-webkit-tap-highlight-color:transparent}
#ft a:active{}
</style>
</head>
<body>

<!-- وسم الـ HTML الخاص بالقائمة المعدل هنا -->
<nav id="nv">
  <!-- أزرار القائمة تضاف هنا -->
</nav>

</body>
</html>
